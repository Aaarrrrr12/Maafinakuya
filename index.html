<style>
:root{--bg:#FFE6EE;--bg2:#E8DBFA;--ink:#3A2340;--soft:#6E5878;--rose:#D0587A;--rose2:#B94A6C;--card:#FFFBFC;--glow:rgba(208,88,122,.3);--b1:#FFB3C7;--b2:#C9B6FF;--b3:#FFD9A8;

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--fb);color:var(--ink);background:linear-gradient(160deg,var(--bg),var(--bg2));overflow-x:hidden;
padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.bl{position:fixed;border-radius:50%;filter:blur(55px);opacity:.6;z-index:0;pointer-events:none;animation:dr2 16s ease-in-out infinite alternate}
.b1{width:18rem;height:18rem;background:var(--b1);top:-5rem;left:-6rem}
.b2{width:20rem;height:20rem;background:var(--b2);bottom:-7rem;right:-7rem;animation-delay:-6s}
.b3{width:13rem;height:13rem;background:var(--b3);top:40%;left:55%;animation-delay:-11s}
@keyframes dr2{to{transform:translate(40px,-30px) scale(1.15)}}
.fl{position:fixed;bottom:-40px;z-index:0;pointer-events:none;animation:rise linear infinite;opacity:0}
.fl svg{width:100%;height:100%;fill:var(--rose)}
@keyframes rise{0%{transform:translate(0,0) rotate(-10deg);opacity:0}10%{opacity:.4}50%{transform:translate(var(--sx),-55vh) rotate(12deg)}90%{opacity:.2}100%{transform:translate(calc(var(--sx)*-1),-115vh) rotate(-8deg);opacity:0}}
main{position:relative;z-index:1;min-height:100%;max-width:28rem;margin:0 auto;padding:1.1rem 1.2rem 1.6rem;display:flex;flex-direction:column;justify-content:center;gap:.2rem}
.dots{display:flex;gap:.4rem;justify-content:center}
.dots i{width:.5rem;height:.5rem;border-radius:1rem;background:var(--soft);opacity:.3;transition:.5s}
.dots i.on{opacity:1;background:var(--rose);width:1.5rem}
.stage{width:min(23rem,104%);height:15rem;margin:0 auto -.8rem;display:grid;place-items:center;position:relative;z-index:2}
.stage svg{width:100%;height:100%;overflow:visible}
.card{position:relative;z-index:1;border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--b1),var(--b2),var(--rose)) border-box;border-radius:1.7rem;padding:1.5rem 1.3rem 1.2rem;text-align:center;box-shadow:0 18px 44px -14px var(--glow);animation:in .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@keyframes tx{from{opacity:0;transform:translateY(8px)}}
h1{font:700 1.75rem/1.15 var(--fd);margin-bottom:.55rem;letter-spacing:-.01em}
p{font-size:1.06rem;line-height:1.6;color:var(--soft);margin-bottom:.6rem;text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto}
.btn{display:block;width:100%;border:0;border-radius:1rem;padding:.95rem 1rem;font:700 1.02rem var(--fb);background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;cursor:pointer;text-align:center;text-decoration:none;margin-top:.6rem;box-shadow:0 8px 18px -8px var(--glow);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .5s,transform .5s}
.btn:active{transform:scale(.98)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--rose)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.b{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.ey{transform-box:fill-box;transform-origin:center;animation:bl 4.2s infinite}@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ra,.la{transform-box:fill-box;transform-origin:50% 8%}
.wave .ra{animation:wv .55s ease-in-out infinite alternate}@keyframes wv{from{transform:rotate(-125deg)}to{transform:rotate(-155deg)}}
.hugR .ra{animation:aR .9s 1.9s both ease-out}@keyframes aR{to{transform:rotate(-85deg)}}
.hugL .la{animation:aL .9s 1.9s both ease-out}@keyframes aL{to{transform:rotate(85deg)}}
.tr{animation:tr 2s ease-in infinite}@keyframes tr{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
.sh{animation:shk .22s linear infinite}@keyframes shk{50%{transform:translateX(1.6px)}}
.dr{opacity:0;animation:dr 1.2s linear infinite}@keyframes dr{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(95px);opacity:0}}
.rp{transform-box:fill-box;transform-origin:center;animation:rp 1.6s ease-out infinite}@keyframes rp{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.cl{animation:cl 4s ease-in-out infinite alternate}@keyframes cl{to{transform:translateX(10px)}}
.cx{animation:cx 4s .8s ease-in both}@keyframes cx{to{transform:translateX(-140px);opacity:0}}
.q{transform-box:fill-box;transform-origin:center;animation:qf 2.2s ease-in-out infinite}@keyframes qf{50%{transform:translateY(-9px) rotate(14deg)}}
.rb{stroke-dasharray:1;stroke-dashoffset:1;animation:rb 2s .5s ease-out forwards}@keyframes rb{to{stroke-dashoffset:0}}
.ray{transform-box:fill-box;transform-origin:center;animation:rot 14s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.sun{animation:su 1.6s ease-out both}@keyframes su{from{transform:translateY(30px);opacity:0}}
.pl{transform-box:fill-box;transform-origin:center;animation:pl 1.1s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.22)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}@keyframes tw{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1);opacity:1}}
.hh{fill:#D95F76;opacity:0;animation:hr 3s infinite}@keyframes hr{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-52px)}}
.w1{animation:w1 2.6s ease-out both}.w2{animation:w2 2.6s ease-out both}
@keyframes w1{from{transform:translateX(-110px)}}@keyframes w2{from{transform:translateX(110px)}}
.L{animation:toL 1.6s .3s both ease-in-out}.R{animation:toR 1.6s .3s both ease-in-out}
.s-end{--d:0px}.s-ok{--d:24px}.s-wait{--d:3px}
@keyframes toL{to{transform:translateX(var(--d))}}@keyframes toR{to{transform:translateX(calc(var(--d)*-1))}}
.env{position:relative;width:9.5rem;height:6.5rem;transform:scale(1.2)}

.env .bk{background:#E58A9E;z-index:1}
.env .lt{background:#fff;left:.7rem;right:.7rem;top:.3rem;bottom:.8rem;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.12);animation:lift 1.3s 1.1s both ease-out}
.env .ft{background:#F2A3B3;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:3}
.env .fp{background:#EE93A6;clip-path:polygon(0 0,100% 0,50% 60%);transform-origin:50% 0;z-index:4;animation:op 1s .5s both ease-in-out}
.env>svg{position:absolute;left:50%;top:50%;width:1.5rem;height:1.5rem;margin:-1rem 0 0 -.75rem;z-index:5;fill:#fff;animation:sl .8s .5s both,pu 1.6s ease-in-out infinite}
.bs{position:absolute;left:50%;top:25%;width:1.1rem;height:1.1rem;margin:-.5rem;z-index:6;opacity:0;animation:bs 1.8s both}.bs svg{width:100%;height:100%;fill:var(--rose)}
@keyframes op{to{transform:rotateX(180deg)}}@keyframes lift{to{transform:translateY(-2.6rem)}}@keyframes sl{to{opacity:0}}@keyframes pu{50%{transform:scale(1.18)}}
@keyframes bs{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1)}}
.btn.in{opacity:1;transform:none;pointer-events:auto}.btn.in:active{transform:scale(.98)}
.cr{display:none;width:2px;height:1.05em;background:var(--rose);vertical-align:text-bottom;margin-right:-2px;animation:cb .8s steps(1) infinite}
.typing .cr{display:inline-block}.gh{visibility:hidden}
@keyframes cb{50%{opacity:0}}
.jp{animation:jp .6s ease-in-out infinite alternate}@keyframes jp{to{transform:translateY(-18px)}}
.slow .ra{animation-duration:1.2s!important}
.dt{animation:dt 1.4s infinite}@keyframes dt{0%,100%{opacity:.2}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fl,.bs{display:none}.env .lt{transform:translateY(-2.6rem)}.env .fp{transform:rotateX(180deg)}.rb{stroke-dashoffset:0}.hh{opacity:1}}
</style>
</head>
<body>
<i class="bl b1"></i><i class="bl b2"></i><i class="bl b3"></i>
<main>
  <div class="dots" id="dots" aria-hidden="true"></div>

<script>
const CFG={telegram:'aaandmi'};
const $=s=>document.querySelector(s);
const HP='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
for(let k=0;k<20;k++){const d=document.createElement('i'),z=10+Math.random()*18;d.className='fl';
  d.style.cssText='left:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(8+Math.random()*9)+'s;animation-delay:-'+Math.random()*16+'s;--sx:'+(Math.random()*70-35)+'px';
  d.innerHTML='<svg viewBox="0 0 24 24"><path d="'+HP+'"/></svg>';document.body.appendChild(d);}

const K='stroke="#3A2340" fill="none" stroke-linecap="round"';
const eye=x=>'<g class="ey"><circle cx="'+x+'" cy="60" r="5.2" fill="#3A2340"/><circle cx="'+(x+1.9)+'" cy="58" r="1.9" fill="#fff"/></g>';
const arc=x=>'<path '+K+' stroke-width="3.5" d="M'+(x-6)+' 62 Q'+x+' 54 '+(x+6)+' 62"/>';
const FACE={
 sad:eye(47)+eye(73)+'<path '+K+' stroke-width="3" d="M40 54 L53 49M80 54 L67 49"/><path '+K+' stroke-width="3.5" d="M53 80 Q60 73 67 80"/><path class="tr" fill="#8FC8F0" d="M82 64 q4.5 7 0 10 q-4.5 -3 0 -10z"/>',
 sorry:eye(47)+eye(73)+'<path '+K+' stroke-width="3" d="M40 54 L53 51M80 54 L67 51"/><path '+K+' stroke-width="3.5" d="M52 78 q4 -3 8 0 q4 3 8 0"/>',
 hope:eye(47)+eye(73)+'<path '+K+' stroke-width="3.5" d="M53 74 Q60 82 67 74"/>',
 happy:arc(47)+arc(73)+'<path d="M51 73 Q60 90 69 73Z" fill="#3A2340" stroke="#3A2340" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="60" cy="81" rx="4.5" ry="2.6" fill="#F4879E"/>'
};
const COL={
 A:{b:'#F2B98B',e:'#E79F6C',l:'#FFF0DD',x:'<path d="M31 94 Q60 108 89 94 L91 104 Q60 119 29 104Z" fill="#6FA8DC"/>'},
 B:{b:'#F7B6C8',e:'#EE8FAC',l:'#FFF1F5',x:'<path d="M86 24 L72 16 L72 32Z M86 24 L100 16 L100 32Z" fill="#E0526F"/><circle cx="86" cy="24" r="4" fill="#C93C5A"/>'}
};
const doll=(k,m,o)=>{const c=COL[k];return '<g class="'+(o||'')+'" filter="url(#st)"><g class="b">'+
 '<circle cx="34" cy="32" r="13" fill="'+c.b+'"/><circle cx="34" cy="32" r="6.5" fill="'+c.e+'"/><circle cx="86" cy="32" r="13" fill="'+c.b+'"/><circle cx="86" cy="32" r="6.5" fill="'+c.e+'"/>'+
 '<ellipse cx="42" cy="108" rx="12" ry="8" fill="'+c.e+'"/><ellipse cx="78" cy="108" rx="12" ry="8" fill="'+c.e+'"/>'+
 '<g class="la"><ellipse cx="27" cy="82" rx="8" ry="14" transform="rotate(25 27 82)" fill="'+c.b+'"/></g><g class="ra"><ellipse cx="93" cy="82" rx="8" ry="14" transform="rotate(-25 93 82)" fill="'+c.b+'"/></g>'+
 '<ellipse cx="60" cy="72" rx="34" ry="33" fill="'+c.b+'"/><ellipse cx="60" cy="86" rx="19" ry="15" fill="'+c.l+'"/>'+c.x+
 '<ellipse cx="37" cy="70" rx="6" ry="4" fill="#F4879E" opacity=".55"/><ellipse cx="83" cy="70" rx="6" ry="4" fill="#F4879E" opacity=".55"/><ellipse cx="60" cy="68" rx="3.4" ry="2.4" fill="#3A2340"/>'+FACE[m]+'</g></g>';};
const F='<defs><filter id="st" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="3.5" result="d"/><feGaussianBlur in="d" stdDeviation="3"/><feOffset dy="4" result="sh"/><feFlood flood-color="#7a3a5a" flood-opacity=".28"/><feComposite in2="sh" operator="in" result="s"/><feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="s"/><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
const svg=x=>'<svg viewBox="0 0 240 160">'+F+x+'</svg>';
const at=(k,m,o,x,y)=>'<g transform="translate('+x+' '+y+')">'+doll(k,m,o)+'</g>';
const cloud=(x,y,c)=>'<g transform="translate('+x+' '+y+')"><g class="'+c+'" fill="#BFB1D1" filter="url(#st)"><ellipse cx="0" cy="4" rx="30" ry="13"/><circle cx="-15" cy="-4" r="13"/><circle cx="6" cy="-9" r="16"/></g></g>';
const heart=(x,y,s,c,d,f)=>'<g transform="translate('+x+' '+y+') scale('+s+')"><g class="'+c+'" style="animation-delay:'+d+'s"'+(f?' fill="#D0587A" filter="url(#st)"':'')+'><path d="'+HP+'"/></g></g>';
const spark=(x,y,d)=>'<g transform="translate('+x+' '+y+')"><path class="tw" style="animation-delay:'+d+'s" fill="#F6C75E" d="M0-7L2-2 7 0 2 2 0 7-2 2-7 0-2-2Z"/></g>';
const hearts3=(x0,y,d0)=>[0,12,24].map((x,j)=>heart(x0+x,y,.5,'hh',d0+j*.9)).join('');
const drops=(xs,y)=>xs.map((x,j)=>'<path class="dr" style="animation-delay:'+(j*.24)+'s" d="M'+x+' '+y+' q3 6 0 9 q-3 -3 0 -9z" fill="#8FC0E6"/>').join('');
const ENV='<div class="env"><div class="bk"></div><div class="lt"></div><div class="ft"></div><div class="fp"></div><svg viewBox="0 0 24 24"><path d="'+HP+'"/></svg>'+[[-70,-80],[-35,-95],[0,-100],[35,-95],[70,-80]].map((v,j)=>'<b class="bs" style="--x:'+v[0]+'px;--y:'+v[1]+'px;animation-delay:'+(1.5+j*.12)+'s"><svg viewBox="0 0 24 24"><path d="'+HP+'"/></svg></b>').join('')+'</div>';
const rb=()=>['#F08AA0','#FFC96B','#8FD3B6','#8EC5F2'].map((c,j)=>'<path class="rb" pathLength="1" d="M'+(24+j*9)+' 128 A'+(96-j*9)+' '+(96-j*9)+' 0 0 1 '+(216-j*9)+' 128" stroke="'+c+'" stroke-width="7" fill="none" stroke-linecap="round" style="animation-delay:'+(.5+j*.25)+'s"/>').join('');
const rays=()=>{let r='';for(let a=0;a<8;a++){const t=a*Math.PI/4;r+='<line x1="'+(36+Math.cos(t)*16).toFixed(1)+'" y1="'+(32+Math.sin(t)*16).toFixed(1)+'" x2="'+(36+Math.cos(t)*24).toFixed(1)+'" y2="'+(32+Math.sin(t)*24).toFixed(1)+'"/>';}return r;};

const SC=[
 ()=>ENV,
 ()=>svg(cloud(120,20,'cl')+drops([92,106,120,134,148],40)+[80,120,160].map((x,j)=>'<ellipse class="rp" style="animation-delay:'+(j*.5)+'s" cx="'+x+'" cy="150" rx="14" ry="3.5" fill="none" stroke="#8FC0E6" stroke-width="1.6"/>').join('')+at('A','sad','sh',60,30)),
 ()=>svg(at('A','sorry','',60,32)+[[78,60,0],[154,54,.45],[118,22,.9],[168,96,1.3]].map(a=>'<text class="q" style="animation-delay:'+a[2]+'s" x="'+a[0]+'" y="'+a[1]+'" font-size="28" font-weight="700" fill="#D0587A" font-family="Nunito,sans-serif" stroke="#fff" stroke-width="3" paint-order="stroke">?</text>').join('')),
 ()=>svg(rb()+'<g class="sun"><circle cx="36" cy="32" r="12" fill="#FBD779"/><g class="ray" stroke="#FBD779" stroke-width="3" stroke-linecap="round">'+rays()+'</g></g>'+cloud(150,24,'cx')+at('A','sorry','',60,36)),
 ()=>svg(heart(102,0,1.5,'pl',0,1)+spark(56,40,0)+spark(186,50,.6)+spark(50,104,1.1)+spark(192,110,1.5)+heart(52,70,.5,'hh',.4)+heart(176,70,.45,'hh',1.4)+at('A','happy','wave',60,40)),
  ()=>svg(at('A','hope','',60,30)+'<g transform="translate(110 104) scale(.9)"><g class="b"><g class="pl" fill="#D0587A" filter="url(#st)"><path d="'+HP+'"/></g></g></g>'+heart(70,64,.5,'hh',0)+heart(168,70,.45,'hh',1.1)+heart(90,36,.4,'hh',2)+heart(152,34,.45,'hh',2.8)+spark(54,100,.3)+spark(190,98,1.2))
];
const S=[
 {t:'Ada surat kecil buat kamu',p:['Isinya nggak panjang, cuma hal yang pengen aku bilang ke kamu.','Kamu boleh berhenti kapan aja kalau lagi nggak pengen baca.'],b:'Buka surat'},
 {t:'Aku mau minta maaf',p:['Bukan buat bikin kamu langsung baik lagi.','Aku cuma mau kamu tahu kalau aku sadar aku salah.'],b:'Lanjut'},
 {t:'Aku cemburu berlebihan',p:['Aku nanya terus dan curiga duluan, padahal kamu nggak salah apa-apa.','Itu bikin kamu capek jelasin hal yang seharusnya nggak perlu dijelasin.'],b:'Lanjut'},
 {t:'Itu salahku, bukan salahmu',p:['Aku nggak punya hak buat ngatur atau nuntut penjelasan dari kamu. Rasa cemburu itu urusanku buat diberesin.','Mungkin kamu paham kenapa aku sampai bersikap begitu. Tapi itu bukan pembenaran. Seperti yang kamu bilang tadi, aku bukan pacar kamu, jadi kamu nggak punya tanggung jawab apa-apa atas perasaanku.','Kamu nggak pantas dapat sikapku kemarin.'],b:'Lanjut'},
 {t:'Kamu sabar banget',p:['Waktu aku rewel, kamu masih sabar dan mau jelasin. Makasih ya.','Pikiranku emang suka berisik, tapi aku lagi belajar mengecilkan volumenya.'],b:'Lanjut'},
 {t:'Aku kangen kamu yang ketawa',p:['Aku nggak mau kamu capek gara-gara aku. Aku pengen lihat kamu ketawa lagi.','Kalau lagi capek atau nggak mood, itu boleh banget. Kamu nggak harus jawab sekarang, pilih aja yang paling pas.'],end:1}
];
const REPLY={
 ok:{lbl:'Aku terima maafmu',msg:'Aku terima maafmu.',r:'Makasih ya. Aku bakal pelan-pelan, dan kamu boleh ingetin aku kalau mulai ngulang.'},
 wait:{lbl:'Aku butuh waktu dulu',msg:'Aku butuh waktu dulu.',r:'Oke, aku tunggu. Dan aku nggak akan nanya terus.'},
 end:{lbl:'Kita udahan aja ya gini-giniannya',msg:'Kita udahan aja ya gini-giniannya.',r:'Oke. Aku terima, dan makasih udah jujur. Maaf buat semuanya.'}
};
const tp=(t,tag)=>'<'+tag+' data-t="'+t+'"><span class="ty"></span><i class="cr"></i><span class="gh">'+t+'</span></'+tag+'>';
let run=0;
async function typeIn(c){
  const id=++run,red=matchMedia('(prefers-reduced-motion:reduce)').matches;let skip=red;
  c.onclick=e=>{if(!e.target.closest('.btn'))skip=true};
  for(const el of c.querySelectorAll('[data-t]')){
    const t=el.dataset.t,ty=el.querySelector('.ty'),gh=el.querySelector('.gh');
    el.classList.add('typing');
    for(let n=1;n<=t.length;n++){
      if(id!==run)return;
      if(!skip){const ch=t[n-1];await new Promise(r=>setTimeout(r,ch==='.'?260:ch===','?120:16+Math.random()*14));}
      ty.textContent=t.slice(0,n);gh.textContent=t.slice(n);
    }
    el.classList.remove('typing');
  }
  if(id!==run)return;
  c.querySelectorAll('.btn').forEach((b,j)=>setTimeout(()=>b.classList.add('in'),skip?0:j*140));
}
let i=0;
const reset=c=>{c.style.animation='none';void c.offsetWidth;c.style.animation='';};
function show(){
  const s=S[i],c=$('#card');
  $('#stage').innerHTML=SC[i]();
  $('#dots').innerHTML=S.map((_,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join('');
  reset(c);
  let ls=[].concat(s.p);if(ls.join(' ').length<=150)ls=[ls.join(' ')];
  c.innerHTML=tp(s.t,'h1')+ls.map(x=>tp(x,'p')).join('')+(s.end?Object.keys(REPLY).map(k=>'<button class="btn'+(k==='ok'?'':' alt')+'" data-r="'+k+'">'+REPLY[k].lbl+'</button>').join(''):'<button class="btn" id="nx">'+s.b+'</button>');
  const nx=$('#nx');if(nx)nx.onclick=()=>{i++;show();};
  c.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>done(b.dataset.r));
  typeIn(c);
}
function done(k){
  const r=REPLY[k],c=$('#card');let x;
  if(k==='ok')x=heart(102,0,1.5,'pl',0,1)+[[64,70,.2],[176,64,.7],[88,40,1.1],[152,44,1.6],[120,26,.4]].map(a=>heart(a[0],a[1],.5,'hh',a[2])).join('')+spark(52,44,0)+spark(190,50,.6)+spark(48,104,1.1)+spark(194,108,1.5)+at('A','happy','jp wave',60,34);
  else if(k==='wait')x='<g filter="url(#st)"><ellipse cx="120" cy="22" rx="26" ry="12" fill="#fff"/></g>'+[108,120,132].map((cx,j)=>'<circle class="dt" style="animation-delay:'+(j*.35)+'s" cx="'+cx+'" cy="22" r="3.2" fill="#6E5878"/>').join('')+at('A','hope','',60,34)+'<g transform="translate(110 108) scale(.9)"><g class="b"><g class="pl" fill="#D0587A" filter="url(#st)"><path d="'+HP+'"/></g></g></g>';
  else x=cloud(120,20,'cl')+drops([108,120,132],40)+at('A','sad','wave slow',60,34);
  $('#stage').innerHTML=svg(x);
  reset(c);
  c.innerHTML=tp('Makasih sudah baca','h1')+tp(r.r,'p')+'<a class="btn" href="https://t.me/'+encodeURIComponent(CFG.telegram)+'?text='+encodeURIComponent(r.msg)+'" target="_blank" rel="noopener">Kirim jawabanmu ke Telegram</a>';
  typeIn(c);
}
show();
</script>
